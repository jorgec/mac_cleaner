[package]
name = "cleaner-cli"
description = "Command-line front end and composition root for the cleaner."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Library + thin binary: the renderer, selector, run-id and hint logic are unit-testable
# (spec 002b); `main.rs` is the composition root.
[lib]
name = "cleaner_cli"
path = "src/lib.rs"

[[bin]]
name = "cleaner"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
cleaner-core = { path = "../cleaner-core" }
cleaner-macos = { path = "../cleaner-macos" }
clap = { workspace = true }
ulid = { workspace = true }
# SIGINT -> CancelToken; JSON rendering. Unused by the stubs; the composition root needs them.
signal-hook = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }
